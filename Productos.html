<!DOCTYPE html>
<html>
<head>
  <title>Productos</title>
  <style>
    body {
      background-color: skyblue;
      text-align: center;
      font-family: sans-serif;
    }
    img {
      width: 100px;
      height: 100px;
    }
    button {
      font-size: 20px;
      margin: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Productos</h1>
  <img id="imagen" src="fanta.JPG">

  <div>
    <button onclick="cambiar(-1)">⯇</button>
    <button onclick="cambiar(1)">⯈</button>
  </div>

  <script>
    const fotos = ["fanta.JPG", "topo chico.JPG", "power up.JPG", "monster.JPG", "jumex.JPG"];
    let i = 0;
    function cambiar(direccion) {
      i = (i + direccion + fotos.length) % fotos.length;
      document.getElementById("imagen").src = fotos[i];
    }
  </script>

</body>
</html>
